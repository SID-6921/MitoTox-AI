<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#fcfcfb"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" fill="#0b0b0b" font-weight="600">
    Figure 1 - Leakage-resistant MitoTox AI workflow
  </text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#52514e">
    Primary endpoint: TOX21_MMP_ratio (mitochondrial membrane-potential disruption)
  </text>

  <!-- Box 1: chemicals -->
  <rect x="30" y="150" width="170" height="110" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
  <text x="115" y="188" text-anchor="middle" font-size="30" fill="#2a78d6" font-weight="700">7,268</text>
  <text x="115" y="210" text-anchor="middle" font-size="13" fill="#0b0b0b">chemicals tested on</text>
  <text x="115" y="228" text-anchor="middle" font-size="13" fill="#0b0b0b">the primary endpoint</text>
  <text x="115" y="246" text-anchor="middle" font-size="12" fill="#898781">(1,158 active, 15.9%)</text>

  <!-- Arrow 1 -->
  <line x1="205" y1="205" x2="255" y2="205" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: scaffold computation -->
  <rect x="260" y="150" width="200" height="110" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
  <text x="360" y="192" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="600">Bemis-Murcko</text>
  <text x="360" y="212" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="600">scaffold computation</text>
  <text x="360" y="236" text-anchor="middle" font-size="12" fill="#898781">grouped by scaffold,</text>
  <text x="360" y="252" text-anchor="middle" font-size="12" fill="#898781">whole groups assigned</text>

  <!-- Arrow 2 -->
  <line x1="465" y1="205" x2="515" y2="205" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: three-way split -->
  <rect x="520" y="90" width="230" height="230" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="635" y="118" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="600">Scaffold-separated split</text>

  <rect x="540" y="132" width="190" height="40" rx="6" fill="#2a78d6"/>
  <text x="635" y="157" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Train: 5,087 (70%)</text>

  <rect x="540" y="180" width="190" height="40" rx="6" fill="#eb6834"/>
  <text x="635" y="205" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Val: 1,090 (15%)</text>

  <rect x="540" y="228" width="190" height="40" rx="6" fill="#4a3aa7"/>
  <text x="635" y="253" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Test: 1,091 (15%) - LOCKED</text>

  <text x="635" y="288" text-anchor="middle" font-size="12" fill="#0ca30c" font-weight="600">
    verified: zero scaffold overlap
  </text>
  <text x="635" y="304" text-anchor="middle" font-size="11" fill="#898781">
    across train / val / test
  </text>

  <!-- Arrow 3 -->
  <line x1="755" y1="205" x2="805" y2="205" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: locked evaluation -->
  <rect x="810" y="150" width="165" height="110" rx="8" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
  <text x="892" y="188" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="600">Locked test</text>
  <text x="892" y="206" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="600">evaluation</text>
  <text x="892" y="228" text-anchor="middle" font-size="11" fill="#898781">no feature selection,</text>
  <text x="892" y="242" text-anchor="middle" font-size="11" fill="#898781">threshold tuning, or</text>
  <text x="892" y="256" text-anchor="middle" font-size="11" fill="#898781">re-optimization after this point</text>

  <!-- bottom note -->
  <rect x="30" y="360" width="945" height="70" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
  <text x="502" y="388" text-anchor="middle" font-size="12.5" fill="#52514e">
    Hyperparameters (LR / Random Forest / XGBoost) selected using only the validation set.
  </text>
  <text x="502" y="408" text-anchor="middle" font-size="12.5" fill="#52514e">
    A random split of the same proportions is evaluated only for comparison, never as the primary result.
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#898781"/>
    </marker>
  </defs>
</svg>
